# Must match the Worker that actually exists on the account. It is "pdf-sy"
# with the hyphen; a mismatch here does not error, it quietly deploys to a
# second, brand-new Worker and leaves the live one untouched. The D1 database
# and R2 bucket are named without the hyphen — that is correct, they are
# separate resources and their names are set below.
name = "pdf-sy"
main = "src/index.tsx"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# Logs and metrics in the dashboard rather than only in `wrangler tail`. Worth
# having from the first deploy: the interesting failures here are other
# people's uploads at times you are not watching a terminal.
[observability]
enabled = true

# The nightly retention sweep. Without this entry the `scheduled` handler in
# src/index.tsx is dead code, expired files stay in R2 for good, and the
# deletion promise in the privacy policy is not true. 03:17 rather than 03:00
# because every cron in the world runs on the hour.
[triggers]
crons = ["17 3 * * *"]

# Static assets (CSS, client bundles, vendored pdf.js). The Worker handles
# everything else. `run_worker_first` is left off: assets win for real files,
# the Worker gets every dynamic route.
[assets]
directory = "./public"
binding = "ASSETS"

# The PDFs themselves. R2 has no egress fee, which is the whole reason this
# business is cheap to run.
[[r2_buckets]]
binding = "FILES"
bucket_name = "pdfsy-files"

# Metadata: documents, links, view sessions, page stats.
[[d1_databases]]
binding = "DB"
database_name = "pdfsy"
database_id = "b387d45c-68d8-4bdb-b90b-d6a843f84eea"

[vars]
# SITE_URL is optional: every link is built from the origin the request came in
# on, so the same build works on *.workers.dev and on pdf.sy with no change.
# Set it only if the canonical domain must differ from the serving host.
# SITE_URL = "https://pdf.sy"
# Anonymous links self-destruct. This is the abuse ceiling and the signup pitch.
ANON_LINK_TTL_DAYS = "7"
MAX_UPLOAD_MB = "25"
MAIL_FROM = "pdf.sy <hello@pdf.sy>"

# Turnstile. The site key is public by design — it ships in the HTML — so it
# belongs here rather than in a secret. Its partner does not:
#
#   npx wrangler secret put TURNSTILE_SECRET
#
# Without that secret the widget still renders but nothing is verified, which
# is what lets a fresh clone run with no Cloudflare account. It also means a
# deploy that forgets it is unprotected: check the Worker logs for
# "turnstile: no TURNSTILE_SECRET set".
TURNSTILE_SITE_KEY = "0x4AAAAAAEZr2gYqpkziK-NN"

# Optional allowlist of hostnames a token may be issued for, comma-separated.
# Unset, the host the request arrived on is used, which keeps *.workers.dev and
# localhost working. Pin it once pdf.sy is the only hostname serving this.
# TURNSTILE_HOSTNAMES = "pdf.sy,www.pdf.sy"

# RESEND_API_KEY is a secret, not a var:
#   npx wrangler secret put RESEND_API_KEY
# Without it, mail is printed to the console instead of sent, which is exactly
# what you want locally.

# Stripe price IDs. Not secrets — they identify a price, they do not authorise
# a charge, and the checkout form posts them to Stripe anyway. The two that ARE
# secret live outside this file:
#
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#
# Without STRIPE_SECRET_KEY the pricing page still renders and the buttons
# still click; checkout redirects back to /pricing?error=billing_not_configured
# rather than failing hard. That is deliberate — a fresh clone runs with no
# Stripe account at all.
#
# These are LIVE-mode prices — real money. Test mode issues different IDs for
# the same products, so nothing here works against a sk_test_ key and nothing
# from test mode works against these.
#
# Four, because Stripe has no concept of "the yearly version of this price" —
# monthly and yearly are separate, unrelated objects. Prices are also immutable:
# one cannot be edited from $32 to $3, only archived and replaced.
#
# The yearly prices are the full annual charge. The page quotes them divided by
# twelve ($2 and $8) because that is the number people compare, so the amounts
# here will never match the amounts on screen — that is correct, not a bug.
#
#   Lite   $3/mo    $24/yr   (shown as $2/mo, billed yearly)
#   Pro    $12/mo   $96/yr   (shown as $8/mo, billed yearly)
STRIPE_PRICE_LITE_MONTHLY = "price_1U7puoCirj36Az1Wx5XP4Rzs"
STRIPE_PRICE_LITE_YEARLY = "price_1U7pxcCirj36Az1WbsbtrFWS"
STRIPE_PRICE_PRO_MONTHLY = "price_1U7pvjCirj36Az1W8E1ejjol"
STRIPE_PRICE_PRO_YEARLY = "price_1U7pyRCirj36Az1W6IdHqvDv"
